<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="530" viewBox="0 0 940 530" role="img" aria-label="Terminal com o perfil do Hendrick Ströngreen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace; font-size: 14px; }
    /* Estado padrão = tudo visível. A animação só esconde ANTES do atraso (fill-mode backwards). */
    .l { animation: show 0.01s steps(1) backwards; }
    .pr { fill: #3DDC84; font-weight: bold; }
    .cmd { fill: #E6EDF3; }
    .k { fill: #FBAD18; }
    .v { fill: #3DDC84; }
    .ok { fill: #3DDC84; font-weight: bold; }
    .cur { fill: #3DDC84; animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l, .cur { animation: none; } }
  </style>

  <!-- janela -->
  <rect x="1" y="1" width="938" height="528" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M1 11 a10 10 0 0 1 10 -10 h918 a10 10 0 0 1 10 10 v26 h-938 z" fill="#161B22"/>
  <circle cx="26" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="20" r="6" fill="#27C93F"/>
  <text x="470" y="25" text-anchor="middle" fill="#8B949E" style="font-size:13px">hendrick@strongreen: ~</text>

  <!-- whoami -->
  <text class="l" x="36" y="72" style="animation-delay:0.2s"><tspan class="pr">hendrick@strongreen:~$</tspan><tspan class="cmd" dx="8">whoami</tspan></text>
  <text class="l v" x="36" y="97" style="animation-delay:0.4s">Hendrick Ströngreen</text>

  <!-- cat profile.txt -->
  <text class="l" x="36" y="147" style="animation-delay:0.7s"><tspan class="pr">hendrick@strongreen:~$</tspan><tspan class="cmd" dx="8">cat profile.txt</tspan></text>

  <text class="l" x="36" y="172" style="animation-delay:0.9s"><tspan class="k">role</tspan><tspan class="v" x="232">= Pentester @ Accenture Brasil</tspan></text>
  <text class="l" x="36" y="197" style="animation-delay:1.05s"><tspan class="k">formação</tspan><tspan class="v" x="232">= Eng. da Computação + Pós em IoT + Pós em Ethical Hacking &amp; Cybersecurity</tspan></text>
  <text class="l" x="36" y="222" style="animation-delay:1.2s"><tspan class="k">especialidade</tspan><tspan class="v" x="232">= IoT Security · Hardware Hacking</tspan></text>
  <text class="l" x="36" y="247" style="animation-delay:1.35s"><tspan class="k">background</tspan><tspan class="v" x="232">= Dev Full Stack (sim, eu também escrevo o código que depois quebro)</tspan></text>
  <text class="l" x="36" y="272" style="animation-delay:1.5s"><tspan class="k">base</tspan><tspan class="v" x="232">= Santos/SP, Brasil</tspan></text>
  <text class="l" x="36" y="297" style="animation-delay:1.65s"><tspan class="k">missão</tspan><tspan class="v" x="232">= formar a próxima geração de profissionais de Cybersecurity</tspan></text>
  <text class="l" x="36" y="322" style="animation-delay:1.8s"><tspan class="k">próximo_destino</tspan><tspan class="v" x="232">= Alemanha</tspan></text>

  <!-- start -->
  <text class="l" x="36" y="372" style="animation-delay:2.1s"><tspan class="pr">hendrick@strongreen:~$</tspan><tspan class="cmd" dx="8">./start --mode=maker</tspan></text>
  <text class="l" x="36" y="397" style="animation-delay:2.4s"><tspan class="ok">[ok]</tspan><tspan class="v" dx="8">código compilado e gravado na placa</tspan></text>
  <text class="l" x="36" y="422" style="animation-delay:2.6s"><tspan class="ok">[ok]</tspan><tspan class="v" dx="8">sensor lendo dados e mandando pra nuvem</tspan></text>
  <text class="l" x="36" y="447" style="animation-delay:2.8s"><tspan class="ok">[ok]</tspan><tspan class="v" dx="8">GreenPass: cartão NFC aprovado no totem</tspan></text>
  <text class="l" x="36" y="472" style="animation-delay:3.0s"><tspan class="ok">[ok]</tspan><tspan class="v" dx="8">Greengeld: extrato importado e categorizado</tspan></text>

  <!-- prompt final com cursor piscando -->
  <g class="l" style="animation-delay:3.4s">
    <text x="36" y="512"><tspan class="pr">hendrick@strongreen:~$</tspan></text>
    <rect class="cur" x="232" y="500" width="9" height="16"/>
  </g>
</svg>
