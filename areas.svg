<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-label="Áreas de atuação: Hardware, Automotivo, Maker e Pentest" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace; }
    .t { font-size: 15px; font-weight: bold; letter-spacing: 1px; }
    .s { font-size: 12px; fill: #C9D1D9; }
    .trace { fill: none; stroke: #FBAD18; stroke-width: 2; stroke-dasharray: 7 6; opacity: .85; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    @media (prefers-reduced-motion: reduce) { .trace { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363D" opacity=".6"/></pattern>
  </defs>
  <rect x="1" y="1" width="938" height="358" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="938" height="358" rx="10" fill="url(#dots)"/>

  <!-- trilhas -->
  <path class="trace" d="M300 75 H340 V155 H380"/>
  <path class="trace" d="M300 285 H340 V205 H380"/>
  <path class="trace" d="M640 75 H600 V155 H560"/>
  <path class="trace" d="M640 285 H600 V205 H560"/>
  <g fill="#0D1117" stroke="#FBAD18" stroke-width="2">
    <circle cx="340" cy="75" r="4"/><circle cx="340" cy="285" r="4"/>
    <circle cx="600" cy="75" r="4"/><circle cx="600" cy="285" r="4"/>
    <circle cx="340" cy="155" r="4"/><circle cx="340" cy="205" r="4"/>
    <circle cx="600" cy="155" r="4"/><circle cx="600" cy="205" r="4"/>
  </g>

  <!-- chip central -->
  <g fill="#FBAD18">
    <rect x="400" y="120" width="12" height="10" rx="2"/><rect x="428" y="120" width="12" height="10" rx="2"/><rect x="456" y="120" width="12" height="10" rx="2"/><rect x="484" y="120" width="12" height="10" rx="2"/><rect x="512" y="120" width="12" height="10" rx="2"/><rect x="536" y="120" width="12" height="10" rx="2"/>
    <rect x="400" y="230" width="12" height="10" rx="2"/><rect x="428" y="230" width="12" height="10" rx="2"/><rect x="456" y="230" width="12" height="10" rx="2"/><rect x="484" y="230" width="12" height="10" rx="2"/><rect x="512" y="230" width="12" height="10" rx="2"/><rect x="536" y="230" width="12" height="10" rx="2"/>
  </g>
  <rect x="380" y="130" width="180" height="100" rx="8" fill="#161B22" stroke="#FBAD18" stroke-width="2"/>
  <circle cx="396" cy="146" r="3" fill="#FBAD18"/>
  <text x="470" y="177" text-anchor="middle" style="font-size:19px;font-weight:bold" fill="#FFFFFF">HENDRICK</text>
  <text x="470" y="200" text-anchor="middle" style="font-size:12px;letter-spacing:2px" fill="#FBAD18">STRÖNGREEN</text>

  <!-- nós -->
  <rect x="40" y="30" width="260" height="90" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="40" y="30" width="5" height="90" rx="2" fill="#3DDC84"/>
  <text x="62" y="66" class="t" fill="#3DDC84">HARDWARE</text>
  <text x="62" y="88" class="s">UART, JTAG, firmware</text>
  <text x="62" y="106" class="s">análise de dispositivos IoT</text>

  <rect x="640" y="30" width="260" height="90" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="640" y="30" width="5" height="90" rx="2" fill="#E5484D"/>
  <text x="662" y="66" class="t" fill="#E5484D">AUTOMOTIVO</text>
  <text x="662" y="88" class="s">Car Hacking e segurança</text>
  <text x="662" y="106" class="s">de sistemas embarcados</text>

  <rect x="40" y="240" width="260" height="90" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="40" y="240" width="5" height="90" rx="2" fill="#FBAD18"/>
  <text x="62" y="276" class="t" fill="#FBAD18">MAKER</text>
  <text x="62" y="298" class="s">Arduino, ESP32,</text>
  <text x="62" y="316" class="s">Raspberry Pi e NFC</text>

  <rect x="640" y="240" width="260" height="90" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="640" y="240" width="5" height="90" rx="2" fill="#4DA3FF"/>
  <text x="662" y="276" class="t" fill="#4DA3FF">PENTEST</text>
  <text x="662" y="298" class="s">Web, mobile e hardware</text>

</svg>
