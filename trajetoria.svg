<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-label="Trajetória: loja de manutenção (5 anos), eNotas (cerca de 3 anos), KaBuM! (2 anos), Accenture (atual) e Alemanha (próximo passo). Experiência: Hardware 5 anos, Programação 5 anos, Segurança 4 anos." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1s ease-out backwards; }
    @keyframes grow { from { transform: scaleX(0); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { transform: scale(.7); opacity: .8; } to { transform: scale(1.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bar, .pulse { animation: none; } }
  </style>
  <rect x="1" y="1" width="938" height="378" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

