<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="Fora do terminal: Corpo, Mar, Lockpicking, Bancada, Conteúdo, Mente, Games e Zephyr" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace; }
    .n { font-size: 13px; font-weight: bold; }
    .d { font-size: 11px; fill: #8B949E; }
    .orbit { fill: none; stroke: #3B4452; stroke-width: 1.5; stroke-dasharray: 2 8; stroke-linecap: round; animation: flow 4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
  </style>
